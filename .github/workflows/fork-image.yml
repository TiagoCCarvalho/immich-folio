# Builds this fork's Docker image and publishes it to the fork owner's GHCR
# namespace, so a NAS can pull ghcr.io/<owner>/immich-folio:fork without
# building locally. Runs only on the fix branch to avoid clashing with any
# upstream workflows.
name: fork-image

on:
  push:
    branches: [fix/insecure-http-admin]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR repository names must be lowercase; github.repository_owner
      # preserves the account's casing (e.g. "TiagoCCarvalho"), so lowercase
      # it here instead of using it directly in the tag.
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/immich-folio:fork" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
